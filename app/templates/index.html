<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        AI Research Assistant
    </title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="sidebar-header">

            <h1>
                AI Research
            </h1>

            <p>
                Agentic RAG Assistant
            </p>

        </div>

        <div class="section">

            <h3>
                Upload Source
            </h3>

            <input
                type="file"
                id="fileInput"
                accept=".pdf,.csv">

            <button
                id="uploadBtn">

                Upload

            </button>

        </div>

        <div class="section">

            <h3>
                Website
            </h3>

            <input
                type="text"
                id="urlInput"
                placeholder="https://example.com">

            <button
                id="scrapeBtn">

                Load Website

            </button>

        </div>

        <div class="section">

            <h3>
                Active Source
            </h3>

            <div id="status">

                No document loaded

            </div>

        </div>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <h2>
                AI Research Assistant
            </h2>

            <span>
                Gemini • FAISS • Agentic RAG
            </span>

        </header>

        <div
            id="chatMessages"
            class="chat-messages">

            <div class="assistant-message">

                <div class="message-label">

                    Assistant

                </div>

                Upload a PDF, CSV, or Website and start asking questions.

            </div>

        </div>

        <div
            id="typing"
            class="typing">

            Thinking...

        </div>

        <div class="chat-input">

            <input
                type="text"
                id="questionInput"
                placeholder="Ask anything about your documents...">

            <button
                id="sendBtn">

                ➜

            </button>

        </div>

    </main>

</div>

<script
src="{{ url_for('static', filename='js/app.js') }}">
</script>

</body>
</html>
